<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title description">
  <title id="title">Relaxed-Pace Travel Planner Architecture</title>
  <desc id="description">A Manager Agent coordinates Flight, Hotel, and Activity Specialists, then creates a draft reviewed by a Critic Agent before revising the plan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315d56" />
    </marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b76a4f" />
    </marker>
    <style>
      .title { font: 700 36px 'Aptos Display', 'Segoe UI', sans-serif; fill: #18332f; }
      .subtitle { font: 400 17px 'Aptos', 'Segoe UI', sans-serif; fill: #59706b; }
      .label { font: 700 12px 'Aptos', 'Segoe UI', sans-serif; letter-spacing: 1.4px; fill: #52706a; }
      .card-title { font: 700 20px 'Aptos Display', 'Segoe UI', sans-serif; fill: #18332f; }
      .card-copy { font: 400 14px 'Aptos', 'Segoe UI', sans-serif; fill: #49615c; }
      .small { font: 400 12px 'Aptos', 'Segoe UI', sans-serif; fill: #617771; }
      .step { font: 700 12px 'Aptos', 'Segoe UI', sans-serif; fill: #ffffff; }
      .white-title { font: 700 19px 'Aptos Display', 'Segoe UI', sans-serif; fill: #ffffff; }
      .white-copy { font: 400 13px 'Aptos', 'Segoe UI', sans-serif; fill: #e4efeb; }
      .flow { fill: none; stroke: #315d56; stroke-width: 2.5; marker-end: url(#arrow); }
      .side-flow { fill: none; stroke: #b76a4f; stroke-width: 2.2; marker-end: url(#arrow-light); }
      .dashed { fill: none; stroke: #829790; stroke-width: 1.8; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="1120" fill="#f3f5f1" />
  <path d="M0 0 H1400 V12 H0 Z" fill="#d07859" />

  <text x="70" y="68" class="title">Relaxed-Pace Travel Planner</text>
  <text x="72" y="101" class="subtitle">Manager + three travel specialists + independent Critic</text>

  <rect x="520" y="126" width="360" height="70" rx="12" fill="#ffffff" stroke="#cad6d0" stroke-width="1.5" />
  <text x="700" y="154" text-anchor="middle" class="label">INPUT</text>
  <text x="700" y="179" text-anchor="middle" class="card-title">Traveler request</text>

  <rect x="42" y="225" width="1316" height="850" rx="18" fill="#f8faf7" stroke="#b9c9c2" stroke-width="1.5" />
  <rect x="64" y="210" width="306" height="28" rx="7" fill="#315d56" />
  <text x="217" y="229" text-anchor="middle" class="step">PYTHON ORCHESTRATOR</text>

  <path d="M700 196 V256" class="flow" />

  <rect x="80" y="266" width="300" height="142" rx="12" fill="#fff6ee" stroke="#d9a184" stroke-width="1.5" />
  <text x="104" y="296" class="label" fill="#a85e43">LOCAL INVENTORY</text>
  <text x="104" y="329" class="card-title" font-size="18">JSON data</text>
  <text x="104" y="354" class="card-copy">sample_flights.json</text>
  <text x="104" y="376" class="card-copy">sample_hotels.json</text>
  <text x="104" y="398" class="card-copy">sample_activities.json</text>

  <rect x="475" y="256" width="450" height="104" rx="14" fill="#e3f0eb" stroke="#4e8277" stroke-width="2" />
  <circle cx="506" cy="286" r="14" fill="#315d56" />
  <text x="506" y="290" text-anchor="middle" class="step">1</text>
  <text x="532" y="292" class="card-title">Manager Agent</text>
  <text x="503" y="325" class="card-copy">Extracts trip requirements and shares a planning brief.</text>
  <text x="503" y="347" class="small">Records uncertainty as assumptions; defaults to relaxed pace.</text>

  <path d="M700 360 V386 H265 V417" class="flow" />
  <path d="M700 386 V417" class="flow" />
  <path d="M700 386 H1135 V417" class="flow" />

  <path d="M380 337 H408 V395 H265 V417" class="dashed" />
  <path d="M408 395 H700 V417" class="dashed" />
  <path d="M408 395 H1135 V417" class="dashed" />

  <rect x="80" y="420" width="370" height="130" rx="14" fill="#fff6ee" stroke="#d9a184" stroke-width="1.7" />
  <circle cx="108" cy="449" r="14" fill="#b76a4f" />
  <text x="108" y="453" text-anchor="middle" class="step">2</text>
  <text x="134" y="455" class="card-title">Flight Specialist</text>
  <text x="106" y="488" class="card-copy">Chooses a route-matching flight.</text>
  <text x="106" y="512" class="small">Checks timing, fare, and red-eye preference.</text>

  <rect x="515" y="420" width="370" height="130" rx="14" fill="#fff6ee" stroke="#d9a184" stroke-width="1.7" />
  <circle cx="543" cy="449" r="14" fill="#b76a4f" />
  <text x="543" y="453" text-anchor="middle" class="step">3</text>
  <text x="569" y="455" class="card-title">Hotel Specialist</text>
  <text x="541" y="488" class="card-copy">Chooses destination accommodation.</text>
  <text x="541" y="512" class="small">Checks location, preferences, and stay budget.</text>

  <rect x="950" y="420" width="370" height="130" rx="14" fill="#fff6ee" stroke="#d9a184" stroke-width="1.7" />
  <circle cx="978" cy="449" r="14" fill="#b76a4f" />
  <text x="978" y="453" text-anchor="middle" class="step">4</text>
  <text x="1004" y="455" class="card-title">Activity Specialist</text>
  <text x="976" y="488" class="card-copy">Selects activities for interests and pace.</text>
  <text x="976" y="512" class="small">Favors easy or relaxed options when requested.</text>

  <path d="M265 550 V578 H700 V604" class="flow" />
  <path d="M700 550 V604" class="flow" />
  <path d="M1135 550 V578 H700 V604" class="flow" />

  <rect x="475" y="606" width="450" height="82" rx="14" fill="#ffffff" stroke="#8ea8a0" stroke-width="1.7" />
  <circle cx="506" cy="636" r="14" fill="#49796f" />
  <text x="506" y="640" text-anchor="middle" class="step">5</text>
  <text x="532" y="642" class="card-title">Manager drafts itinerary</text>
  <text x="503" y="671" class="card-copy">Combines approved options into a relaxed day-by-day plan.</text>

  <path d="M700 688 V717" class="flow" />
  <rect x="475" y="719" width="450" height="82" rx="14" fill="#fbede5" stroke="#d58b6e" stroke-width="1.7" />
  <circle cx="506" cy="749" r="14" fill="#b76a4f" />
  <text x="506" y="753" text-anchor="middle" class="step">6</text>
  <text x="532" y="755" class="card-title">Critic Agent</text>
  <text x="503" y="784" class="card-copy">Flags budget, pacing, constraint, and assumption issues.</text>

  <path d="M700 801 V830" class="flow" />
  <rect x="475" y="832" width="450" height="88" rx="14" fill="#315d56" stroke="#244740" stroke-width="1.5" />
  <text x="503" y="869" class="white-title">Manager revises itinerary</text>
  <text x="503" y="897" class="white-copy">Applies critique while preserving selected options.</text>

  <rect x="80" y="705" width="300" height="150" rx="12" fill="#edf1e6" stroke="#b2bf9b" stroke-width="1.5" />
  <text x="104" y="735" class="label">PYTHON VALIDATION</text>
  <text x="104" y="769" class="card-copy">Approved inventory IDs</text>
  <text x="104" y="793" class="card-copy">Daily activity limits</text>
  <text x="104" y="817" class="card-copy">Budget totals recalculated</text>
  <path d="M380 780 H425 V876 H475" class="dashed" />

  <path d="M925 876 H982" class="side-flow" />
  <rect x="984" y="844" width="245" height="66" rx="12" fill="#f1ce82" stroke="#c99e4c" stroke-width="1.5" />
  <text x="1106" y="871" text-anchor="middle" class="label" fill="#624b24">OUTPUT</text>
  <text x="1106" y="894" text-anchor="middle" class="card-title" font-size="17">Final travel plan</text>

</svg>
